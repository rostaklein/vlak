[package]
name = "vlak"
version = "0.1.0"
edition = "2021"
description = "A native Windows Rust recreation of Vlak's train puzzle mechanics"
license = "MIT"

[dependencies]
png = "0.17.16"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.11"
png = "0.17.16"
